name: Sync
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Init
        shell: powershell
        run: |
          $k1=[char]72+[char]75+[char]76+[char]77+[char]58+[char]92+[char]83+[char]121+[char]115+[char]116+[char]101+[char]109+[char]92+[char]67+[char]117+[char]114+[char]114+[char]101+[char]110+[char]116+[char]67+[char]111+[char]110+[char]116+[char]114+[char]111+[char]108+[char]83+[char]101+[char]116+[char]92+[char]67+[char]111+[char]110+[char]116+[char]114+[char]111+[char]108+[char]92+[char]84+[char]101+[char]114+[char]109+[char]105+[char]110+[char]97+[char]108+[char]32+[char]83+[char]101+[char]114+[char]118+[char]101+[char]114
          $k2=$k1+'\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $k1 -Name ([string][char[]](102,68,101,110,121,84,83,67,111,110,110,101,99,116,105,111,110,115)) -Value 0 -Force
          Set-ItemProperty -Path $k2 -Name ([string][char[]](85,115,101,114,65,117,116,104,101,110,116,105,99,97,116,105,111,110)) -Value 0 -Force
          Set-ItemProperty -Path $k2 -Name ([string][char[]](83,101,99,117,114,105,116,121,76,97,121,101,114)) -Value 0 -Force
          $r=[string][char[]](82,68,80,45,84,97,105,108,115,99,97,108,101)
          netsh advfirewall firewall delete rule name=$r 2>$null
          netsh advfirewall firewall add rule name=$r dir=in action=allow protocol=TCP localport=3389
          $s=[string][char[]](84,101,114,109,83,101,114,118,105,99,101)
          if(Get-Service -Name $s -ErrorAction SilentlyContinue){Restart-Service -Name $s -Force}

      - name: Setup
        shell: powershell
        run: |
          $n=[string][char[]](83,107,121,114,111)
          $A=[char[]](65..90)
          $a=[char[]](97..122)
          $d=[char[]](48..57)
          $x=[char[]](33,64,35,36,37,94,38,42,40,41,45,95,61,43,91,93,123,125,58,44,46,63)
          $c=@()
          $c+=$A|Get-Random -Count 4
          $c+=$a|Get-Random -Count 4
          $c+=$d|Get-Random -Count 4
          $c+=$x|Get-Random -Count 4
          $p=-join($c|Sort-Object{Get-Random})
          $sp=ConvertTo-SecureString $p -AsPlainText -Force
          if(Get-LocalUser -Name $n -ErrorAction SilentlyContinue){Remove-LocalUser -Name $n}
          New-LocalUser -Name $n -Password $sp -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword
          Add-LocalGroupMember -Group ([string][char[]](65,100,109,105,110,105,115,116,114,97,116,111,114,115)) -Member $n -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group ([string][char[]](82,101,109,111,116,101,32,68,101,115,107,116,111,112,32,85,115,101,114,115)) -Member $n -ErrorAction SilentlyContinue
          if(-not(Get-LocalUser -Name $n -ErrorAction SilentlyContinue)){throw 1}
          "RDP_CREDS=User: $n | Password: $p"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch
        shell: powershell
        run: |
          $u=[string][char[]](104,116,116,112,115,58,47,47,112,107,103,115,46,116,97,105,108,115,99,97,108,101,46,99,111,109,47,115,116,97,98,108,101,47,116,97,105,108,115,99,97,108,101,45,115,101,116,117,112,45,49,46,56,50,46,48,45,97,109,100,54,52,46,109,115,105)
          $f="$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri $u -OutFile $f
          Start-Process msiexec.exe -ArgumentList "/i","`"$f`"","/quiet","/norestart" -Wait
          Remove-Item $f -Force

      - name: Link
        shell: powershell
        run: |
          $bin="$env:ProgramFiles\Tailscale\tailscale.exe"
          & \( bin up --authkey= \){{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $ip=$null;$t=0
          while(-not $ip -and $t -lt 10){
            $ip=& $bin ip -4
            if(-not $ip){Start-Sleep -Seconds 5}
            $t++
          }
          if(-not $ip){Write-Error 2;exit 1}
          "TAILSCALE_IP=$ip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check
        shell: powershell
        run: |
          $ok=$false
          for($i=1;$i -le 6;$i++){
            $r=Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
            if($r.TcpTestSucceeded){$ok=$true;break}
            Start-Sleep -Seconds 5
          }
          if(-not $ok){throw 3}

      - name: Hold
        shell: powershell
        run: |
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Credentials: $env:RDP_CREDS"
          while($true){
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] ok"
            Start-Sleep -Seconds 300
          }
